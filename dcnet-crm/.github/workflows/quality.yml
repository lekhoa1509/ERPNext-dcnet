name: Quality

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - run: python -m compileall -q dcnet_crm
      - run: python scripts/check-backend-safety.py

  frappe-tests:
    if: ${{ vars.DCNET_FRAPPE_TEST_COMMAND != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Frappe integration tests
        run: eval "${{ vars.DCNET_FRAPPE_TEST_COMMAND }}"
