[project]
name = "vn_banking"
authors = [
    { name = "DCNet", email = "dev@dcnet.vn"},
]
description = "Vietnamese bank statement import and auto-match for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "openpyxl",
    "xlrd>=2.0",
    "xlwt>=1.3",
    "rapidfuzz>=3.0",
    "pandas",
    "beautifulsoup4",
    "lxml",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "vn_banking"
