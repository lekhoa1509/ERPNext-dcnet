<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Minh họa màn hình Import Auto</title><desc id="desc">Các nhóm file, trạng thái phân tích và nút import.</desc>
  <rect width="1200" height="700" fill="#f6f8fb"/><rect x="28" y="24" width="1144" height="650" rx="14" fill="#fff" stroke="#d9e0e7"/>
  <text x="64" y="75" font-family="Arial" font-size="27" font-weight="700" fill="#172b4d">Import tự động</text>
  <text x="64" y="104" font-family="Arial" font-size="15" fill="#64748b">Upload Excel → phân tích → kiểm tra → duyệt kế hoạch → import</text>
  <rect x="872" y="49" width="128" height="42" rx="8" fill="#fff" stroke="#94a3b8"/><text x="898" y="76" font-family="Arial" font-size="14" fill="#334155">AI Settings</text>
  <rect x="1014" y="49" width="126" height="42" rx="8" fill="#4f46e5"/><text x="1041" y="76" font-family="Arial" font-size="14" fill="#fff">Tải file lên</text>
  <g font-family="Arial">
    <g><rect x="64" y="133" width="245" height="92" rx="10" fill="#eef2ff"/><text x="82" y="164" font-size="14" fill="#4338ca">Tổng số file</text><text x="82" y="205" font-size="29" font-weight="700" fill="#312e81">15</text></g>
    <g><rect x="325" y="133" width="245" height="92" rx="10" fill="#f0fdf4"/><text x="343" y="164" font-size="14" fill="#166534">Sẵn sàng</text><text x="343" y="205" font-size="29" font-weight="700" fill="#14532d">11</text></g>
    <g><rect x="586" y="133" width="245" height="92" rx="10" fill="#fff7ed"/><text x="604" y="164" font-size="14" fill="#9a3412">Cảnh báo</text><text x="604" y="205" font-size="29" font-weight="700" fill="#7c2d12">3</text></g>
    <g><rect x="847" y="133" width="293" height="92" rx="10" fill="#fef2f2"/><text x="865" y="164" font-size="14" fill="#991b1b">Có lỗi</text><text x="865" y="205" font-size="29" font-weight="700" fill="#7f1d1d">1</text></g>
  </g>
  <text x="64" y="272" font-family="Arial" font-size="19" font-weight="700" fill="#172b4d">Danh mục nền tảng</text>
  <g font-family="Arial" font-size="14">
    <rect x="64" y="291" width="1076" height="72" rx="9" fill="#fff" stroke="#dbe3ea"/>
    <text x="84" y="323" font-size="16" font-weight="700" fill="#334155">🌳 Hệ thống tài khoản (Account)</text><text x="84" y="347" fill="#64748b">he_thong_tai_khoan.xlsx · 259 dòng</text>
    <rect x="766" y="310" width="86" height="31" rx="16" fill="#dcfce7"/><text x="785" y="331" fill="#166534">An toàn</text><rect x="872" y="306" width="112" height="38" rx="7" fill="#fff" stroke="#94a3b8"/><text x="895" y="331" fill="#334155">Kiểm tra</text><rect x="996" y="306" width="120" height="38" rx="7" fill="#4f46e5"/><text x="1024" y="331" fill="#fff">Import</text>
    <rect x="64" y="379" width="1076" height="72" rx="9" fill="#fff" stroke="#dbe3ea"/>
    <text x="84" y="411" font-size="16" font-weight="700" fill="#334155">👤 Khách hàng (Customer)</text><text x="84" y="435" fill="#64748b">customer.xlsx · 1.240 dòng</text>
    <rect x="766" y="398" width="86" height="31" rx="16" fill="#ffedd5"/><text x="783" y="419" fill="#9a3412">Cảnh báo</text><rect x="872" y="394" width="112" height="38" rx="7" fill="#fff" stroke="#94a3b8"/><text x="895" y="419" fill="#334155">Xem lỗi</text><rect x="996" y="394" width="120" height="38" rx="7" fill="#4f46e5"/><text x="1016" y="419" fill="#fff">AI xử lý</text>
    <rect x="64" y="467" width="1076" height="72" rx="9" fill="#fff" stroke="#dbe3ea"/>
    <text x="84" y="499" font-size="16" font-weight="700" fill="#334155">📋 Hàng hóa dịch vụ (Item)</text><text x="84" y="523" fill="#64748b">item_master.xlsx · 4.820 dòng</text>
    <rect x="766" y="486" width="86" height="31" rx="16" fill="#dcfce7"/><text x="785" y="507" fill="#166534">An toàn</text><rect x="872" y="482" width="112" height="38" rx="7" fill="#fff" stroke="#94a3b8"/><text x="896" y="507" fill="#334155">Xem trước</text><rect x="996" y="482" width="120" height="38" rx="7" fill="#4f46e5"/><text x="1024" y="507" fill="#fff">Import</text>
  </g>
  <rect x="64" y="575" width="1076" height="53" rx="8" fill="#eff6ff"/><text x="84" y="608" font-family="Arial" font-size="14" fill="#1e40af">Luôn xem kế hoạch và báo cáo trùng trước khi xác nhận import dữ liệu thật.</text>
  <text x="64" y="655" fill="#64748b" font-family="Arial" font-size="13">Hình minh họa phục vụ training — dữ liệu mẫu, không phải ảnh production.</text>
</svg>
