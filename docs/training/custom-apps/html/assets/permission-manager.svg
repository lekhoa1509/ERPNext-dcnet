  <rect x="1002" y="44" width="137" height="40" rx="8" fill="#0f766e"/><text x="1026" y="70" font-family="Arial" font-size="14" fill="#fff">+ Tạo người dùng</text>
  <rect x="55" y="104" width="268" height="528" rx="10" fill="#f8fafc" stroke="#dbe3ea"/>
