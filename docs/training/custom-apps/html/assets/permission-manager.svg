  <line x1="354" y1="429" x2="1139" y2="429" stroke="#e2e8f0"/><text x="375" y="467" fill="#172b4d" font-weight="700">Trần Thu Hà</text><text x="375" y="488">thuha@dcnet.vn</text><rect x="690" y="448" width="86" height="29" rx="15" fill="#dcfce7"/><text x="706" y="468" fill="#166534">Hoạt động</text><text x="824" y="467">Sales Manager</text><rect x="1037" y="446" width="78" height="34" rx="7" fill="#fff" stroke="#94a3b8"/><text x="1051" y="468">Quyền</text></g>
  <rect x="354" y="548" width="785" height="61" rx="8" fill="#fff7ed"/><text x="377" y="574" font-family="Arial" font-size="14" fill="#9a3412" font-weight="700">Lưu ý kiểm soát</text><text x="377" y="596" font-family="Arial" font-size="13" fill="#7c2d12">Test bằng tài khoản mẫu trước khi áp dụng quyền cho người dùng thật.</text>
  <text x="55" y="655" fill="#64748b" font-family="Arial" font-size="13">Hình minh họa phục vụ training — dữ liệu mẫu, không phải ảnh production.</text>
