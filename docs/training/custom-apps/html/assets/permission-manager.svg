<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Minh họa DCNET Permission Manager</title><desc id="desc">Danh sách phòng ban, người dùng và tab phân quyền module.</desc>
