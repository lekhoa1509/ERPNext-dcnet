<style>
    @media print {
        .appendix-print { page-break-inside: auto; }
        .appendix-print table tr { page-break-inside: avoid; }
    }
    .appendix-print {
        font-family: "Times New Roman", Times, serif;
        font-size: 13px;
        line-height: 1.6;
        color: #000;
        max-width: 210mm;
        margin: 0 auto;
    }
    .appendix-print p {
        margin: 3px 0; text-align: justify;
    }
    .appendix-print table {
        width: 100%; border-collapse: collapse; margin: 10px 0;
    }
    .appendix-print table th,
    .appendix-print table td {
        border: 1px solid #000; padding: 5px 8px; font-size: 12px;
    }
    .appendix-print table th {
        background: #f0f0f0; text-align: center; font-weight: bold;
    }
    .appendix-print ol, .appendix-print ul {
        margin: 5px 0 5px 20px; padding: 0;
    }
    .appendix-print li {
        margin: 2px 0;
    }
</style>

<div class="appendix-print">
    {{ doc.appendix_html or "" }}
</div>
