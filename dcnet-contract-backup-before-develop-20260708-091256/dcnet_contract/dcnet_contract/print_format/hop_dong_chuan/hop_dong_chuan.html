<style>
    @media print {
        .contract-print { page-break-inside: auto; }
        .contract-print table tr { page-break-inside: avoid; }
        .contract-print .page-break-before { page-break-before: always; }
    }
    .contract-print {
        font-family: "Times New Roman", Times, serif;
        font-size: 13px;
        line-height: 1.6;
        color: #000;
        max-width: 210mm;
        margin: 0 auto;
    }
    .contract-print p {
        margin: 3px 0; text-align: justify;
    }
    .contract-print table {
        width: 100%; border-collapse: collapse; margin: 10px 0;
    }
    .contract-print table th,
    .contract-print table td {
        border: 1px solid #000; padding: 5px 8px; font-size: 12px;
    }
    .contract-print table th {
        background: #f0f0f0; text-align: center; font-weight: bold;
    }
    .contract-print ol, .contract-print ul {
        margin: 5px 0 5px 20px; padding: 0;
    }
    .contract-print li {
        margin: 2px 0;
    }
    .contract-print .appendix-separator {
        border-top: 2px dashed #999;
        margin: 30px 0;
        padding-top: 10px;
    }
</style>

<div class="contract-print">
    {# --- HỢP ĐỒNG --- #}
    {{ doc.contract_html_rendered or doc.contract_html or "" }}

    {# --- PHỤ LỤC --- #}
    {% if doc.appendix_html and "Khong tim thay" not in doc.appendix_html %}
    <div class="page-break-before"></div>
    {{ doc.appendix_html }}
    {% endif %}
</div>
