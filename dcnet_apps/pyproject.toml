[project]
name = "dcnet_apps"
authors = [
    { name = "DCNET Cloud", email = "info@dcnet.cloud"}
]
description = "DCNET Custom Business Modules - Fitting, Lead, Coaching, etc."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = "~=16.0"
erpnext = "~=16.0"

[project.urls]
Homepage = "https://dcnet.cloud"
Repository = "https://github.com/dcnet-cloud/flow_next.git"
"Bug Reports" = "https://github.com/dcnet-cloud/flow_next/issues"
