[project]
name = "dcnet_migrate"
authors = [
    { name = "DCNET", email = "dev@dcnet.vn" },
]
description = "Data migration tooling for ERPNext v16 — Import tự động (AI) & friends"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "openpyxl",
    "xlrd>=2.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = "~=16.0"
erpnext = "~=16.0"

[tool.flit.module]
name = "dcnet_migrate"
