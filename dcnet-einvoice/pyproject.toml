[project]
name = "einvoice"
authors = [{name = "DCNet", email = "info@dcnet.vn"}]
description = "Multi-provider E-Invoice Integration for ERPNext v16"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0"
erpnext = ">=16.0.0,<17.0"
